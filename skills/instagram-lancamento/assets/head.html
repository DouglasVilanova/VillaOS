<!-- Esqueleto visual. Tokens {{...}} vêm do instagram.config.json via scripts/build.js. Classe "green" = cor de destaque da marca. -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family={{FONT_URL}}:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --dark:{{DARK}}; --light:{{LIGHT}}; --green:{{ACCENT}}; --green-d:{{ACCENT_DARK}}; --on-accent:{{ON_ACCENT}}; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#222; font-family:'{{FONT}}',sans-serif; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden; padding:90px 90px 80px; display:flex; flex-direction:column; margin-bottom:20px; }
  .story { width:1080px; height:1920px; }
  .dark { background:var(--dark); color:var(--light); }
  .light { background:var(--light); color:#1A1A1A; }
  .green { background:var(--green); color:var(--on-accent); }
  .top { display:flex; justify-content:space-between; align-items:center; position:relative; z-index:2; }
  .logo { height:64px; }
  .light .logo, .green .logo { filter:brightness(0); }
  .count { font-size:16px; font-weight:600; letter-spacing:.18em; opacity:.55; }
  .body { flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; }
  .eyebrow { font-size:16px; font-weight:800; letter-spacing:.28em; text-transform:uppercase; color:var(--green); margin-bottom:34px; }
  .light .eyebrow { color:var(--green-d); } .green .eyebrow { color:var(--on-accent); opacity:.7; }
  h1 { font-size:100px; font-weight:900; line-height:.98; letter-spacing:-.045em; }
  h2 { font-size:68px; font-weight:800; line-height:1.04; letter-spacing:-.035em; }
  .rule { width:80px; height:4px; background:var(--green); margin:40px 0; }
  .light .rule { background:var(--green-d); } .green .rule { background:var(--on-accent); }
  p { font-size:30px; font-weight:500; line-height:1.5; opacity:.8; max-width:860px; }
  .src { font-size:18px; font-weight:500; opacity:.5; margin-top:30px; }
  .hl { color:var(--green); } .light .hl { color:var(--green-d); } .green .hl { color:var(--on-accent); text-decoration:underline; text-decoration-thickness:6px; text-underline-offset:10px; }
  .foot { border-top:1px solid rgba(255,255,255,.12); padding-top:26px; display:flex; justify-content:space-between; font-size:18px; font-weight:600; opacity:.6; position:relative; z-index:2; }
  .light .foot, .green .foot { border-color:rgba(0,0,0,.15); }
  .glow { position:absolute; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb, var(--green) 22%, transparent), transparent 65%); right:-380px; top:-300px; pointer-events:none; }
  .glow.bl { top:auto; bottom:-420px; left:-380px; right:auto; }
  .num { font-size:240px; font-weight:800; line-height:.85; letter-spacing:-.06em; color:var(--green); }
  .light .num { color:var(--green-d); } .green .num { color:var(--on-accent); }
  .big { font-size:200px; font-weight:900; line-height:.9; letter-spacing:-.06em; color:var(--green); }
  .light .big { color:var(--green-d); } .green .big { color:var(--on-accent); }
  .quote { font-size:360px; font-weight:900; line-height:.6; color:var(--green); opacity:.25; position:absolute; top:220px; left:70px; }
  .cta-btn { display:inline-block; margin-top:50px; background:var(--on-accent); color:var(--green); font-size:30px; font-weight:800; padding:28px 48px; border-radius:999px; }
  .dark .cta-btn { background:var(--green); color:var(--on-accent); }
  .center { align-items:center; text-align:center; } .center p { margin:0 auto; } .center .rule { margin:40px auto; }
  .bars { display:flex; gap:80px; align-items:flex-end; height:520px; margin-top:20px; }
  .bar { width:240px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:18px; height:100%; }
  .bar i { display:block; width:100%; border-radius:16px 16px 0 0; background:var(--green); }
  .bar i.g { background:#5A5A5A; } .light .bar i { background:var(--green-d); } .light .bar i.g { background:#BDBDBD; }
  .bar b { font-size:64px; font-weight:800; letter-spacing:-.03em; } .bar span { font-size:26px; font-weight:700; opacity:.7; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:20px; }
  .card { border:1px solid rgba(255,255,255,.14); border-radius:24px; padding:36px; }
  .light .card { border-color:rgba(0,0,0,.12); background:#fff; } .green .card { border-color:rgba(0,0,0,.25); }
  .card b { display:block; font-size:72px; font-weight:800; letter-spacing:-.04em; color:var(--green); line-height:1; }
  .light .card b { color:var(--green-d); } .green .card b { color:var(--on-accent); }
  .card span { display:block; font-size:24px; font-weight:600; margin-top:14px; opacity:.75; }
  .list { list-style:none; margin-top:10px; }
  .list li { font-size:36px; font-weight:700; letter-spacing:-.02em; padding:24px 0; border-bottom:1px solid rgba(255,255,255,.12); display:flex; gap:26px; align-items:baseline; }
  .light .list li, .green .list li { border-color:rgba(0,0,0,.12); }
  .list li span { font-size:20px; font-weight:800; color:var(--green); letter-spacing:.1em; } .light .list li span { color:var(--green-d); } .green .list li span { color:var(--on-accent); }
  .steps { display:flex; flex-direction:column; gap:26px; margin-top:20px; }
  .step { display:flex; gap:30px; align-items:center; font-size:34px; font-weight:700; letter-spacing:-.02em; }
  .step b { width:84px; height:84px; flex:none; border-radius:50%; background:var(--green); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; }
  .green .step b { background:var(--on-accent); color:var(--green); }
  .vs { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:20px; }
  .vs > div { border-radius:28px; padding:44px 38px; }
  .vs .a { background:color-mix(in srgb, var(--light) 8%, var(--dark)); } .vs .b { background:var(--green); color:var(--on-accent); }
  .vs h3 { font-size:46px; font-weight:800; letter-spacing:-.03em; margin-bottom:18px; }
  .vs p { font-size:26px; opacity:.85; }
  .imgbox { border-radius:24px; overflow:hidden; margin-top:10px; box-shadow:0 30px 60px rgba(0,0,0,.35); }
  .imgbox img { width:100%; display:block; }
  .check { font-size:34px; font-weight:700; display:flex; gap:22px; align-items:center; padding:16px 0; }
  .check i { width:52px; height:52px; flex:none; border-radius:50%; background:var(--green); color:var(--on-accent); font-style:normal; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; }
  .green .check i { background:var(--on-accent); color:var(--green); }
  /* Case: celular com print real do site, logo do cliente e selo "ao vivo" */
  .shot { flex:none; width:400px; border-radius:56px; background:#111; border:12px solid #1F1F1F; box-shadow:0 40px 80px rgba(0,0,0,.35); overflow:hidden; aspect-ratio:9/19; }
  .shot img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .shot.lg { width:520px; }
  .logo-card { display:inline-flex; align-items:center; justify-content:center; border-radius:24px; padding:28px 40px; }
  .logo-card.claro { background:#fff; } .logo-card.escuro { background:#141414; border:1px solid rgba(255,255,255,.12); }
  .logo-card img { max-height:110px; max-width:420px; display:block; }
  .live { display:inline-flex; align-items:center; gap:16px; margin-top:34px; border:2px solid var(--green); border-radius:999px; padding:20px 34px; font-size:30px; font-weight:800; letter-spacing:-.01em; }
  .live::before { content:""; width:16px; height:16px; border-radius:50%; background:#FF3B30; box-shadow:0 0 0 6px rgba(255,59,48,.25); }
  .light .live { border-color:var(--green-d); } .green .live { border-color:#0A0A0A; }
  .split { display:flex; gap:60px; align-items:center; } .split .txt { flex:1; min-width:0; }
</style>
</head>
<body>
